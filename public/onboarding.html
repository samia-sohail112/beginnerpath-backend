<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Onboarding - Get Started</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Inter', sans-serif; 
      background: linear-gradient(135deg, #F3F4F6 0%, #F3F4F6 100%); 
      min-height: 100vh; 
      padding: 0; 
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .navbar-logged-in {
      width: 100%;
      background: #fff;
      border-bottom: 1px solid #D1D5DB;
      padding: 1rem 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      flex-shrink: 0;
    }
    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
    }
    .logo-link {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
    }
    .logo-text {
      font-weight: 800;
      font-size: 1.5rem;
      color: #1F2937;
      letter-spacing: -0.5px;
    }
    .nav-links {
      display: flex;
      gap: 1.5rem;
      flex: 1;
      align-items: center;
      justify-content: center;
    }
    .nav-link {
      color: #374151;
      text-decoration: none;
      font-weight: 500;
      font-size: 1rem;
      transition: color 0.2s;
    }
    .nav-link:hover { color: #3B82F6; }
    .nav-actions { display: flex; gap: 0.75rem; align-items: center; flex-shrink: 0; }
    .btn-ghost {
      background: transparent;
      border: 1px solid #D1D5DB;
      padding: 0.5rem 1.2rem;
      border-radius: 30px;
      font-weight: 600;
      color: #374151;
      cursor: pointer;
      transition: 0.2s;
      font-size: 0.95rem;
    }
    .btn-ghost:hover { background: #F3F4F6; }
    @media (max-width: 640px) {
      .nav-links { gap: 0.5rem; font-size: 0.85rem; flex-wrap: wrap; }
      .nav-container { flex-wrap: wrap; }
    }

    .page-content {
      width: 100%;
      max-width: 600px;
      padding: 2rem 1rem;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container { 
      width: 100%;
      background: white; 
      border-radius: 24px; 
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08); 
      padding: 2.5rem 2rem; 
    }

    .header { text-align: center; margin-bottom: 2rem; }
    .header h1 { font-size: 1.8rem; font-weight: 700; color: #1F2937; }
    .header p { color: #6B7280; }

    .progress-bar { height: 6px; background: #D1D5DB; border-radius: 3px; margin-bottom: 2rem; overflow: hidden; }
    .progress-fill { height: 100%; background: #3B82F6; transition: width 0.3s ease; }
    .step-text { text-align: center; color: #6B7280; font-size: 0.85rem; margin-bottom: 1rem; }

    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 0.75rem; color: #374151; }
    .form-group select { width: 100%; padding: 0.875rem 1rem; border: 1.5px solid #D1D5DB; border-radius: 8px; font-size: 0.95rem; background: white; color: #1F2937; }
    .form-group select:focus { outline: none; border-color: #3B82F6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }

    .checkbox-group { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .checkbox-item { display: flex; align-items: center; gap: 0.5rem; }
    .checkbox-item input[type="radio"],
    .checkbox-item input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: #3B82F6; }
    .checkbox-item label { margin: 0; cursor: pointer; font-weight: 500; color: #374151; }

    .section { display: none; }
    .section.active { display: block; }

    .error-message { display: none; background: #FEE2E2; color: #991B1B; padding: 0.875rem 1rem; border-radius: 8px; margin-bottom: 1.25rem; border: 1px solid #FCA5A5; }
    .error-message.show { display: block; }
    .success-message { display: none; background: #DCFCE7; color: #166534; padding: 0.875rem 1rem; border-radius: 8px; margin-bottom: 1.25rem; border: 1px solid #BBF7D0; }
    .success-message.show { display: block; }

    .buttons { display: flex; gap: 1rem; margin-top: 2rem; }
    .btn { flex: 1; padding: 0.875rem 1rem; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
    .btn-primary { background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%); color: white; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary { background: #F3F4F6; color: #374151; border: 1px solid #D1D5DB; }
    .btn-secondary:hover { background: #E5E7EB; }
    .btn:disabled { opacity: 0.7; cursor: not-allowed; }
  </style>
</head>
<body>

  <header class="navbar-logged-in">
    <div class="nav-container">
      <a href="dashboard.html" class="logo-link">
        <span class="logo-text">BeginnerPath</span>
      </a>
      
      <nav class="nav-links">
        <a href="counselor.html" class="nav-link">AI Counselor</a>
      </nav>
      
      <div class="nav-actions">
        <button class="btn-ghost" onclick="logout()">Log Out</button>
      </div>
    </div>
  </header>

  <div class="page-content">
    <div class="container">
      <div class="header">
        <h1>Complete Your Profile</h1>
        <p>Tell us about yourself to personalize your learning journey</p>
      </div>

      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="step-text" id="stepText">Step 1 of 4</div>

      <div class="error-message" id="errorMessage"></div>
      <div class="success-message" id="successMessage"></div>

      <!-- STEP 1 -->
      <div class="section active" id="section1">
        <div class="form-group">
          <label for="educationLevel">What is your education level?</label>
          <select id="educationLevel" required>
            <option value="">Select education level</option>
            <option value="matric">Matric (High School)</option>
            <option value="inter">Intermediate (FSc)</option>
            <option value="bachelor">Bachelor's Degree</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>

      <!-- STEP 2 -->
      <div class="section" id="section2">
        <div class="form-group">
          <label>What is your academic stream?</label>
          <div class="checkbox-group">
            <div class="checkbox-item"><input type="radio" id="stream1" name="stream" value="ics"><label for="stream1">ICS (Computer Science)</label></div>
            <div class="checkbox-item"><input type="radio" id="stream2" name="stream" value="engineering"><label for="stream2">Pre-Engineering</label></div>
            <div class="checkbox-item"><input type="radio" id="stream3" name="stream" value="medical"><label for="stream3">Pre-Medical</label></div>
            <div class="checkbox-item"><input type="radio" id="stream4" name="stream" value="commerce"><label for="stream4">Commerce</label></div>
            <div class="checkbox-item"><input type="radio" id="stream5" name="stream" value="arts"><label for="stream5">Arts</label></div>
          </div>
        </div>
      </div>

      <!-- STEP 3 -->
      <div class="section" id="section3">
        <div class="form-group">
          <label>What are your interests? (Select 2+)</label>
          <div class="checkbox-group">
            <div class="checkbox-item"><input type="checkbox" id="int1" name="interests" value="technology"><label for="int1">Technology</label></div>
            <div class="checkbox-item"><input type="checkbox" id="int2" name="interests" value="business"><label for="int2">Business</label></div>
            <div class="checkbox-item"><input type="checkbox" id="int3" name="interests" value="science"><label for="int3">Science</label></div>
            <div class="checkbox-item"><input type="checkbox" id="int4" name="interests" value="medicine"><label for="int4">Medicine</label></div>
            <div class="checkbox-item"><input type="checkbox" id="int5" name="interests" value="engineering"><label for="int5">Engineering</label></div>
            <div class="checkbox-item"><input type="checkbox" id="int6" name="interests" value="arts"><label for="int6">Arts</label></div>
          </div>
        </div>
      </div>

      <!-- STEP 4 -->
      <div class="section" id="section4">
        <div class="form-group">
          <label for="careerGoal">What is your career goal?</label>
          <select id="careerGoal" required>
            <option value="">Select goal</option>
            <option value="job">Get a Job</option>
            <option value="freelance">Freelance</option>
            <option value="abroad">Study/Work Abroad</option>
            <option value="startup">Start a Business</option>
          </select>
        </div>
        <div class="form-group">
          <label for="timeline">Timeline?</label>
          <select id="timeline" required>
            <option value="">Select timeline</option>
            <option value="3months">3 Months</option>
            <option value="6months">6 Months</option>
            <option value="1year">1 Year</option>
            <option value="flexible">Flexible</option>
          </select>
        </div>
      </div>

      <div class="buttons">
        <button class="btn btn-secondary" id="prevBtn" onclick="previousStep()" style="display:none;">Previous</button>
        <button class="btn btn-primary" id="nextBtn" onclick="nextStep()">Next</button>
      </div>
    </div>
  </div>

  <script>
   const BP_BACKEND_URL = 'https://beginnerpath-backend-1.samiasohail650.repl.co';
    let currentStep = 1;
    const totalSteps = 4;

    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const token = localStorage.getItem('authToken');
        console.log('🔐 Checking token:', token ? '✅ Found' : '❌ Not found');
        
        if (!token) {
          console.error('❌ Token missing or empty - redirecting to login');
          window.location.href = 'login.html';
          return;
        }
        
        console.log('✅ Token verified - loading onboarding form');
        updateProgress();
        loadExistingData();
      }, 100);
    });

    async function loadExistingData() {
      const token = localStorage.getItem('authToken');
      if (!token) {
        window.location.href = 'login.html';
        return;
      }

      try {
        const res = await fetch(`${API_URL}/api/onboarding`, {
          headers: {
            'Authorization': `Bearer ${token.trim()}`
          }
        });

        if (res.ok) {
          const data = await res.json();
          if (data.onboarding) {
            document.getElementById('educationLevel').value = data.onboarding.educationLevel || '';
            document.querySelector(`input[name="stream"][value="${data.onboarding.stream}"]`).checked = true;
            data.onboarding.interests.forEach(interest => {
              document.querySelector(`input[name="interests"][value="${interest}"]`).checked = true;
            });
            document.getElementById('careerGoal').value = data.onboarding.careerGoal || '';
            document.getElementById('timeline').value = data.onboarding.timeline || '';
          }
        }
      } catch (error) {
        console.warn('No existing onboarding data found');
      }
    }

    function nextStep() {
      if (validateStep()) {
        if (currentStep === totalSteps) {
          submitOnboarding();
        } else {
          currentStep++;
          showStep();
        }
      }
    }

    function previousStep() {
      if (currentStep > 1) {
        currentStep--;
        showStep();
      }
    }

    function showStep() {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.getElementById(`section${currentStep}`).classList.add('active');
      updateProgress();
      updateButtons();
      window.scrollTo(0, 0);
    }

    function updateProgress() {
      const percent = (currentStep / totalSteps) * 100;
      document.getElementById('progressFill').style.width = percent + '%';
      document.getElementById('stepText').textContent = `Step ${currentStep} of ${totalSteps}`;
    }

    function updateButtons() {
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      prevBtn.style.display = currentStep === 1 ? 'none' : 'block';
      nextBtn.textContent = currentStep === totalSteps ? 'Complete' : 'Next';
    }

    function validateStep() {
      clearMessages();

      if (currentStep === 1) {
        if (!document.getElementById('educationLevel').value) {
          showError('Please select education level');
          return false;
        }
      }

      if (currentStep === 2) {
        if (!document.querySelector('input[name="stream"]:checked')) {
          showError('Please select your stream');
          return false;
        }
      }

      if (currentStep === 3) {
        const checked = document.querySelectorAll('input[name="interests"]:checked');
        if (checked.length < 2) {
          showError('Please select at least 2 interests');
          return false;
        }
      }

      if (currentStep === 4) {
        if (!document.getElementById('careerGoal').value || !document.getElementById('timeline').value) {
          showError('Please select career goal and timeline');
          return false;
        }
      }

      return true;
    }

    async function submitOnboarding() {
      const educationLevel = document.getElementById('educationLevel').value;
      const stream = document.querySelector('input[name="stream"]:checked').value;
      const interests = Array.from(document.querySelectorAll('input[name="interests"]:checked')).map(el => el.value);
      const careerGoal = document.getElementById('careerGoal').value;
      const timeline = document.getElementById('timeline').value;

      const token = localStorage.getItem('authToken');
      const nextBtn = document.getElementById('nextBtn');
      
      if (!token) {
        showError('Session expired. Please login again.');
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1500);
        return;
      }

      nextBtn.disabled = true;

      try {
        const res = await fetch(`${API_URL}/api/onboarding`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token.trim()}`
          },
          body: JSON.stringify({ educationLevel, stream, interests, careerGoal, timeline })
        });

        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Onboarding failed');

        // ✅ FIX: Clear old user data from localStorage for new account
        localStorage.removeItem('completedCourses');
        localStorage.removeItem('selectedSpecialization');
        localStorage.removeItem('quizResult');
        localStorage.removeItem('quizPassedCourses');
        localStorage.removeItem('formData');

        // Save new form data
        const formData = {
          stream: stream,
          educationLevel: educationLevel,
          interests: interests,
          careerGoal: careerGoal,
          timeline: timeline
        };
        localStorage.setItem('formData', JSON.stringify(formData));

        // Update user data in localStorage
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        user.onboardingComplete = true;
        user.stream = stream;
        user.educationLevel = educationLevel;
        user.interests = interests;
        user.careerGoal = careerGoal;
        user.timeline = timeline;
        localStorage.setItem('user', JSON.stringify(user));

        showSuccess('Setup complete! Redirecting to your roadmap...');
        setTimeout(() => {
          window.location.href = 'roadmap.html';
        }, 1500);

      } catch (err) {
        showError(err.message);
        nextBtn.disabled = false;
      }
    }

    function showError(msg) {
      document.getElementById('errorMessage').textContent = msg;
      document.getElementById('errorMessage').classList.add('show');
    }

    function showSuccess(msg) {
      document.getElementById('successMessage').textContent = msg;
      document.getElementById('successMessage').classList.add('show');
    }

    function clearMessages() {
      document.getElementById('errorMessage').classList.remove('show');
      document.getElementById('successMessage').classList.remove('show');
    }

    function logout() {
      localStorage.removeItem('authToken');
      localStorage.removeItem('user');
      localStorage.removeItem('formData');
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
