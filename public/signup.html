<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Sign Up</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #F3F4F6 0%, #E5E7EB 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .container { background: white; border-radius: 12px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08); width: 100%; max-width: 450px; padding: 2.5rem 2rem; }
    .header { text-align: center; margin-bottom: 2rem; }
    .header h1 { font-size: 1.8rem; font-weight: 700; color: #1F2937; }
    .form-group { margin-bottom: 1.25rem; display: flex; flex-direction: column; }
    .form-group label { font-weight: 600; margin-bottom: 0.5rem; color: #374151; font-size: 0.9rem; }
    .form-group input { padding: 0.75rem 1rem; border: 1.5px solid #D1D5DB; border-radius: 8px; font-size: 0.95rem; }
    .form-group input:focus { outline: none; border-color: #3B82F6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
    .error-message { display: none; background: #FEE2E2; color: #991B1B; padding: 0.875rem 1rem; border-radius: 8px; margin-bottom: 1.25rem; border: 1px solid #FCA5A5; }
    .error-message.show { display: block; }
    .success-message { display: none; background: #DCFCE7; color: #166534; padding: 0.875rem 1rem; border-radius: 8px; margin-bottom: 1.25rem; border: 1px solid #BBF7D0; }
    .success-message.show { display: block; }
    .btn { width: 100%; padding: 0.875rem 1rem; background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
    .btn:hover { opacity: 0.9; transform: translateY(-2px); }
    .btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
    .loading-spinner { display: none; width: 18px; height: 18px; border: 3px solid rgba(255, 255, 255, 0.3); border-radius: 50%; border-top-color: white; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .footer { text-align: center; color: #6B7280; font-size: 0.9rem; margin-top: 1rem; }
    .footer a { color: #3B82F6; text-decoration: none; font-weight: 600; }
    .status { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #E5E7EB; color: #6B7280; }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .dot.online { background: #10B981; }
    .dot.offline { background: #EF4444; }
    .debug-info { display: none; background: #f3f4f6; padding: 0.75rem; border-radius: 6px; margin-top: 1rem; font-size: 0.75rem; color: #666; font-family: monospace; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Sign Up</h1>
    </div>

    <div class="error-message" id="errorMessage"></div>
    <div class="success-message" id="successMessage"></div>
    <div class="debug-info" id="debugInfo"></div>

    <form id="signupForm" onsubmit="handleSignup(event)">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Your full name" required minlength="2"/>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required autocomplete="email"/>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Minimum 6 characters" required minlength="6" autocomplete="new-password"/>
      </div>

      <button type="submit" class="btn" id="signupBtn">
        <span id="btnText">Create Account</span>
        <div class="loading-spinner" id="spinner"></div>
      </button>
    </form>

    <div class="footer">
      Already have account? <a href="login.html">Sign in</a>
    </div>

    <div class="status">
      <div class="dot offline" id="statusDot"></div>
      <span id="statusText">Checking...</span>
    </div>
  </div>

  <script>
const BP_BACKEND_URL = 'https://beginnerpath-backend-1.samiasohail650.repl.co';

    // Clear any existing session on signup page
    localStorage.removeItem('authToken');
    localStorage.removeItem('user');

    document.addEventListener('DOMContentLoaded', () => {
      checkBackend();
    });

    async function checkBackend() {
      try {
        const res = await fetch(`${API_URL}/api/health`);
        if (res.ok) {
          document.getElementById('statusDot').className = 'dot online';
          document.getElementById('statusText').textContent = 'Backend connected';
        }
      } catch (e) {
        document.getElementById('statusDot').className = 'dot offline';
        document.getElementById('statusText').textContent = 'Backend offline';
      }
    }

    async function handleSignup(e) {
      e.preventDefault();
      clearMessages();

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const debugBox = document.getElementById('debugInfo');

      if (!name || !email || !password) {
        showError('Please fill all fields');
        return;
      }

      const btn = document.getElementById('signupBtn');
      btn.disabled = true;
      document.getElementById('btnText').style.display = 'none';
      document.getElementById('spinner').style.display = 'block';

      try {
        console.log('🔄 Sending signup request...');
        const res = await fetch(`${API_URL}/api/auth/signup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });

        const data = await res.json();
        console.log('📦 Server response:', data);

        if (!res.ok) throw new Error(data.error || 'Signup failed');

        // ✅ FIXED: Always save token to localStorage (even if empty)
        // So onboarding knows user is authenticated for signup flow
        console.log('✅ Token valid, saving to localStorage...');
        localStorage.setItem('authToken', data.token || '');
        
        if (data.token === '' || data.token === 'null' || data.token === 'undefined') {
          console.warn('⚠️ WARNING: Token is empty but saved to localStorage');
          debugBox.innerHTML = '⚠️ Token received but empty - proceeding to onboarding';
          debugBox.style.display = 'block';
        }

        // ✅ VALIDATION: Check if user data exists
        if (!data.user) {
          console.error('❌ ERROR: User data missing!');
          debugBox.innerHTML = `
            <strong>❌ DEBUG INFO:</strong><br>
            User data: MISSING<br>
            Response keys: ${Object.keys(data).join(', ')}
          `;
          debugBox.style.display = 'block';
          throw new Error('User data missing from response');
        }

        console.log('✅ Signup successful for:', data.user.email);
        localStorage.setItem('user', JSON.stringify(data.user || { name, email }));
        
        // ✅ Initialize empty formData for onboarding (will be filled by user)
        localStorage.setItem('formData', JSON.stringify({
          stream: '',
          educationLevel: '',
          interests: [],
          careerGoal: '',
          timeline: ''
        }));

        showSuccess('Account created successfully! Redirecting to onboarding...');
        
        // ✅ CORRECT: After signup, always go to onboarding directly
        // (New user needs to complete onboarding)
        setTimeout(() => {
          console.log('🔀 Redirecting to onboarding...');
          window.location.href = 'onboarding.html';
        }, 1500);

      } catch (err) {
        console.error('❌ Signup error:', err);
        showError(err.message);
      } finally {
        btn.disabled = false;
        document.getElementById('btnText').style.display = 'inline';
        document.getElementById('spinner').style.display = 'none';
      }
    }

    function showError(msg) {
      const el = document.getElementById('errorMessage');
      el.textContent = msg;
      el.classList.add('show');
    }

    function showSuccess(msg) {
      const el = document.getElementById('successMessage');
      el.textContent = msg;
      el.classList.add('show');
    }

    function clearMessages() {
      document.getElementById('errorMessage').classList.remove('show');
      document.getElementById('successMessage').classList.remove('show');
      document.getElementById('debugInfo').style.display = 'none';
    }
  </script>
</body>
</html>
