<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Login – BeginnerPath</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f0f4ff 0%, #e8edf5 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .container {
      background: white;
      border-radius: 16px;
      padding: 2.5rem;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      border: 1px solid #e5e7eb;
    }
    h2 { text-align: center; color: #1a1a2e; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1.25rem; }
    label { display: block; font-weight: 600; color: #1a1a2e; margin-bottom: 0.4rem; font-size: 0.9rem; }
    input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    input:focus { outline: none; border-color: #1b3191; box-shadow: 0 0 0 3px rgba(27,49,145,0.1); }
    .btn {
      width: 100%;
      padding: 0.75rem;
      background: linear-gradient(135deg, #1a2f6e, #1b3191);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .message {
      margin-top: 0.75rem;
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
      display: none;
    }
    .message.error { background: #fee2e2; color: #dc2626; display: block; }
    .message.success { background: #dcfce7; color: #16a34a; display: block; }
    .footer-link { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: #6b7280; }
    .footer-link a { color: #1b3191; text-decoration: none; font-weight: 600; }
    .debug-info { display: none; background: #f3f4f6; padding: 0.75rem; border-radius: 6px; margin-top: 1rem; font-size: 0.75rem; color: #666; font-family: monospace; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Welcome Back</h2>
    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="e.g., ayesha12@gmail.com" required/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Enter your password" required/>
      </div>
      <div id="loginMessage" class="message"></div>
      <div id="debugInfo" class="debug-info"></div>
      <button type="submit" class="btn" id="loginBtn">Sign In</button>
      <div class="footer-link">
        Don't have an account? <a href="signup.html">Sign up</a>
      </div>
    </form>
  </div>

  <script>
   const BP_BACKEND_URL = 'https://beginnerpath-backend.username.repl.co';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const msg = document.getElementById('loginMessage');
      const debugBox = document.getElementById('debugInfo');
      const btn = document.getElementById('loginBtn');

      msg.className = 'message';
      msg.style.display = 'none';
      debugBox.style.display = 'none';

      if (!email || !password) {
        msg.textContent = '❌ Please fill in all fields';
        msg.className = 'message error';
        msg.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Logging in...';

      try {
        console.log('🔄 Sending login request...');
        const response = await fetch(`${API_URL}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();
        console.log('📦 Server response:', data);

        if (!response.ok) {
          msg.textContent = '❌ ' + (data.error || 'Invalid credentials');
          msg.className = 'message error';
          msg.style.display = 'block';
          return;
        }

        // ✅ VALIDATION: Check if token exists and is not empty
        if (!data.token || data.token === '' || data.token === 'null' || data.token === 'undefined') {
          console.error('❌ ERROR: Token is missing or empty!');
          console.error('Response data:', data);
          
          debugBox.innerHTML = `
            <strong>❌ DEBUG INFO:</strong><br>
            Token received: ${data.token ? 'EXISTS' : 'MISSING'}<br>
            Token value: "${data.token}"<br>
            Token type: ${typeof data.token}<br>
            Response keys: ${Object.keys(data).join(', ')}<br>
            <br>
            <strong>❌ PROBLEM:</strong> Server not returning valid token!
          `;
          debugBox.style.display = 'block';
          
          msg.textContent = '❌ Login failed: Server error (no token). Check console.';
          msg.className = 'message error';
          msg.style.display = 'block';
          return;
        }

        // ✅ VALIDATION: Check if user data exists
        if (!data.user || !data.user.email) {
          console.error('❌ ERROR: User data missing!');
          
          debugBox.innerHTML = `
            <strong>❌ DEBUG INFO:</strong><br>
            User data: ${data.user ? 'EXISTS' : 'MISSING'}<br>
            Response keys: ${Object.keys(data).join(', ')}
          `;
          debugBox.style.display = 'block';
          
          msg.textContent = '❌ Login failed: User data missing';
          msg.className = 'message error';
          msg.style.display = 'block';
          return;
        }

        // ✅ ALL VALID: Save to localStorage
        console.log('✅ Token valid, saving to localStorage...');
        localStorage.setItem('authToken', data.token);
        localStorage.setItem('userName', data.user.name || 'User');
        localStorage.setItem('userEmail', data.user.email);
        localStorage.setItem('user', JSON.stringify(data.user));
        localStorage.removeItem('token'); // Remove old key if exists
        
        const role = data.user.role || 'user';
        localStorage.setItem('userRole', role);

        console.log('✅ localStorage saved:');
        console.log('   authToken:', localStorage.getItem('authToken').substring(0, 20) + '...');
        console.log('   userName:', localStorage.getItem('userName'));
        console.log('   userRole:', localStorage.getItem('userRole'));

        console.log('📍 Redirecting after login...');

        msg.textContent = '✅ Login successful!';
        msg.className = 'message success';
        msg.style.display = 'block';

        setTimeout(() => {
          console.log('🔀 Redirecting...');
          // ✅ CORRECT: After login, always go to dashboard
          // (User already did onboarding when they signed up)
          if (role === 'admin') {
            console.log('→ Going to admin-panel');
            window.location.href = 'admin-panel.html';
          } else {
            console.log('→ Going to dashboard');
            window.location.href = 'dashboard.html';
          }
        }, 1000);

      } catch (error) {
        console.error('❌ Network error:', error);
        msg.textContent = '❌ Cannot connect to server: ' + error.message;
        msg.className = 'message error';
        msg.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });

    // Show console logs in browser
    const originalLog = console.log;
    console.log = function(...args) {
      originalLog.apply(console, args);
    };
  </script>
</body>
</html>
